name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Civic data validation
        run: bun run data:validate

      - name: Research validation
        run: bun run research:validate

      - name: Research tests
        run: bun run research:test

      - name: Research index sync
        run: bun run research:index:check

      - name: Civic pipeline tests
        run: bun run data:test

      - name: Production build
        run: bun run build
