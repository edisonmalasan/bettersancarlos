name: Probe workflow parsing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Limit refresh to one registry source id (optional)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Echo inputs
        run: |
          echo "source=${{ inputs.source }}"
